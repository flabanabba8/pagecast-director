name: pagecast-director
version: "0.4.0"
description: "Editable cast narration with locked voices, source passage IDs, resumable synthesis and selective regeneration."
author: "PageCast Director contributors"
license: GPL-3.0-or-later
requires_hermes: ">=0.22.3"
optional_env:
  - name: PAGECAST_GOOGLE_CLIENT_ID
    description: "Only for the Vertex Gemini route: the id of your own Google Cloud OAuth client (type Desktop app)."
    url: "https://console.cloud.google.com/apis/credentials"
  - name: PAGECAST_GOOGLE_CLIENT_SECRET
    description: "Only for the Vertex Gemini route: the secret of that OAuth client. Stored by Hermes."
    url: "https://console.cloud.google.com/apis/credentials"
    secret: true
oauth:
  - id: google
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/cloud-platform
    client_id_env: PAGECAST_GOOGLE_CLIENT_ID
    client_secret_env: PAGECAST_GOOGLE_CLIENT_SECRET
    hosts: [aiplatform.googleapis.com]
    authorize_params: {access_type: offline, prompt: consent}
provides_tools:
  - pagecast_knowledge
  - pagecast_setup
  - pagecast_series_list
  - pagecast_series_create
  - pagecast_series_link
  - pagecast_series_voice
  - pagecast_overview
  - pagecast_cast_note
  - pagecast_reading_position
  - pagecast_direction_context
  - pagecast_direct
  - pagecast_import
  - pagecast_books
  - pagecast_book
  - pagecast_assign
  - pagecast_voice
  - pagecast_voice_audition
  - pagecast_speech_options
  - pagecast_speech_setup
  - pagecast_edit
  - pagecast_render
  - pagecast_cancel
  - pagecast_preview
  - pagecast_retry
  - pagecast_export
  - pagecast_android_app
  - pagecast_android_install
  - pagecast_timeline
  - pagecast_usage
  - pagecast_inworld_voices
config_schema:
  inworld_api_key: {type: secret, env: INWORLD_API_KEY, required: false, label: "Inworld API credential", description: "Complete Base64 credential copied from Inworld Portal. Stored by Hermes, never in book data."}
  inworld_model: {type: str, default: "inworld-tts-2", choices: [inworld-tts-2, inworld-tts-2-flash], description: "Hosted Inworld speech model; synthesis sends text/voice IDs to Inworld and consumes your account credits."}
  elevenlabs_api_key: {type: secret, env: ELEVENLABS_API_KEY, required: false, label: "ElevenLabs API key", description: "Stored by Hermes, never in book data. Synthesis sends text to ElevenLabs and consumes your account credits."}
  elevenlabs_model: {type: str, default: "eleven_multilingual_v2", choices: [eleven_multilingual_v2, eleven_flash_v2_5, eleven_turbo_v2_5], description: "Hosted ElevenLabs model."}
  gemini_api_key: {type: secret, env: GEMINI_API_KEY, required: false, label: "Gemini API key", description: "Stored by Hermes, never in book data. Synthesis sends text to Google and may consume your quota or billing."}
  gemini_model: {type: str, default: "gemini-3.8-flash-tts", description: "Gemini speech model ID, for example gemini-3.8-flash-tts (current flagship per Google, 2026-11-07), gemini-3.8-flash-lite-tts or gemini-3.1-flash-tts-preview."}
  gemini_route: {type: str, default: "developer", choices: [developer, vertex], description: "Vertex uses a Google sign-in held by Hermes (hermes auth add pagecast-director:google) and a user-configured Google Cloud project; designed voices are scoped to that route."}
  gemini_project: {type: str, default: "", description: "Your Google Cloud project for Vertex; kept in private Hermes configuration."}
  gemini_max_usd: {type: float, default: 3.0, description: "Per-book Vertex spending guard using conservative full list token rates; each request reserves an estimate from its text length (min 0.005, max about 0.13 USD); unknown requests keep it."}
  higgs_url: {type: str, default: "http://localhost:8000", description: "Already-running local Higgs TTS3 server origin."}
  higgs_model: {type: str, default: "bosonai/higgs-tts-3-4b", description: "Served local model identifier."}
  higgs_revision: {type: str, default: "", description: "Model revision used in audio cache identity; update when changing weights."}
  host_tts_tool: {type: str, default: "", description: "Optional selected registered speech tool. engine=host preserves host auth/approvals; no model/provider fallback."}
  host_tts_backend_id: {type: str, default: "", description: "Explicit provider/runtime/model revision identity. Change when the effective backend changes so cache reuse stays correct."}
  host_tts_arguments: {type: str, default: "{}", description: "JSON tool arguments with {text}, {voice}, {model} placeholders. Credentials belong to the selected host tool settings."}
  host_tts_model: {type: str, default: "", description: "User-selected model passed only where configured in the host arguments."}
  host_tts_audio_field: {type: str, default: "path", description: "Dotted JSON field containing the selected speech tool's local PCM WAV path."}
  host_tts_credit: {type: str, default: "", description: "Required attribution/terms notice for the selected backend; preserved with exports."}
  audio_normalizer_argv: {type: str, default: "", description: "Optional JSON argv converting {input} to mono24kHz16-bit PCM at {output}. Native compatible WAV needs no converter; otherwise installed FFmpeg is the default adapter."}
provides_hooks:
  - pre_tool_call
